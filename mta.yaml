_schema-version: '3.3'
ID: toolsathi
version: 0.1.0
description: ToolSathi simulated backend
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run build
modules:
  - name: toolsathi-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    properties:
      NODE_ENV: production
      AUTH_MODE: xsuaa
      ENFORCE_APPROVALS: 'true'
      ALLOW_UNAPPROVED_MOCKS: 'false'
    build-parameters:
      builder: npm-ci
    requires:
      - name: toolsathi-db
      - name: toolsathi-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
  - name: toolsathi-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: toolsathi-db
resources:
  - name: toolsathi-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: toolsathi-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
